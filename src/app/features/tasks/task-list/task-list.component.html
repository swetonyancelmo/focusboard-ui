<mat-toolbar>
  <span>FocusBoard</span>
  <span class="spacer"></span>
  <button mat-stroked-button (click)="logout()">Sair</button>
</mat-toolbar>

<div class="content">
  <div class="content-header">
    <h2>Minhas Tarefas</h2>
    <button mat-flat-button (click)="openDialog()">+ Nova Tarefa</button>
  </div>

  <div class="task-grid">
    @for (task of tasks(); track task.id) {
      <mat-card>
        <mat-card-header>
          <mat-card-title>{{ task.title }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <p>{{ task.description }}</p>
          <mat-chip-set class="chips">
            <mat-chip>{{ statusLabels[task.status] }}</mat-chip>
            <mat-chip>{{ priorityLabels[task.priority] }}</mat-chip>
          </mat-chip-set>
        </mat-card-content>

        <mat-card-actions>
          <button mat-button (click)="openDialog(task)">Editar</button>
          <button mat-button color="warn" (click)="deleteTask(task.id)">Excluir</button>
        </mat-card-actions>
      </mat-card>
    }
  </div>

  <mat-paginator
    [length]="totalElements()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>
